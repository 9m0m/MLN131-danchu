<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- Circular background with gradient -->
    <defs>
        <radialGradient id="grad" cx="30%" cy="30%">
            <stop offset="0%" style="stop-color:#b00000;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8b0000;stop-opacity:1" />
        </radialGradient>
    </defs>

    <!-- Circular background -->
    <circle cx="50" cy="50" r="50" fill="url(#grad)" />

    <!-- Gold border -->
    <circle cx="50" cy="50" r="48" fill="none" stroke="#d4af37" stroke-width="1.5" />

    <!-- Text initial "M" for MLN131 -->
    <text x="50" y="62" font-family="Georgia, serif" font-size="52" font-weight="bold"
        fill="#d4af37" text-anchor="middle" letter-spacing="-2">M</text>
</svg>